[project]
name = "nerc-citations"
version = "1.0.0"
description = "NERC dataset citation pipeline (DataCite + Scholexplorer + Overton -> Results/v3)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
citations = "citations.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["citations*"]
