name: Get NERC DOIs from DataCite

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"  # Run every Sunday at midnight (UTC)

permissions:
  contents: write
    
jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v3

      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run pipeline stage
        env:
          PYTHONUNBUFFERED: "1" # Forces Python to print immediately without buffering
        run: python -m citations_fun dois


      - name: Commit and push results
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add "Results/intermediate_data/nerc_datacite_dois.json"
          git commit -m "Regular action, updates nerc_datacite_dois.json"
          git push https://github.com/NERC-EDS/citationNotebook.git main

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
