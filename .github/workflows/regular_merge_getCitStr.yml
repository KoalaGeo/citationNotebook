name: Merge citation results, get citation string and final processing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 0"  # Run every Sunday at 11pm (UTC)

permissions:
  contents: write
    
jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v3

      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run pipeline stage
        env:
          PYTHONUNBUFFERED: "1" # Forces Python to print immediately without buffering
        run: python -m citations_fun merge


      - name: Commit and push results
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add "Results/v3/latest_results.csv" "Results/v3/filtered_out_df.csv" "Results/v3/latest_results.json"
          git commit -m "Regular action, updates latest_results_nerc_citations csv and json files"
          git push https://github.com/NERC-EDS/citationNotebook.git main

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
